name: Build and Push
run-name: "Build ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - develop
          - staging
        default: develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backend
  SYFT_VERSION: "1.52.0"
  SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write   # SLSA build provenance (actions/attest-build-provenance)
      artifact-metadata: write  # its storage record (registry link); without it only a warning

    steps:
      # A manual run builds only what the branch rules protect: develop from develop or main,
      # staging only from main (a PR-checked, reviewed commit). Any other branch would give an
      # image the PR checks never saw a path to staging and production.
      - name: Only main and develop may be built
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.environment }}
        run: |
          case "${REF}" in
            refs/heads/main|refs/heads/develop) ;;
            *) echo "::error::builds run only from main or develop, not ${REF}"; exit 1 ;;
          esac
          if [[ "${EVENT}" == "workflow_dispatch" && "${TARGET}" == "staging" && "${REF}" != "refs/heads/main" ]]; then
            echo "::error::a staging image is built only from main"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes to git

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The arm64 image runs RUN steps of its final stage (apk upgrade, ...) on this amd64 runner:
      # that needs QEMU emulation. Without it a cache miss fails with "exec format error".
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Determine environment
        id: env
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            echo "environment=${TARGET}" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_NAME}" == "main" ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%s)
          BUILD_DATE=$(date -u +%Y%m%d-%H%M%S)
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${VERSION#v}"
          ENV="${{ steps.env.outputs.environment }}"

          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "full_tag=${ENV}-v${VERSION}-${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      # Scan BEFORE anything is pushed or signed (security review 2026-09-27): build each published
      # platform into the local Docker (one platform per load), scan it, and stop on a fixable
      # CRITICAL/HIGH. The push below publishes exactly these two images.
      # Trivy reads trivy.yaml / .trivyignore from the repo root if present; the inputs below win.
      # Each platform has its own GHA cache scope (a shared scope makes the builds overwrite each other).
      - name: Build image for the scan (linux/amd64, local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: local-scan/backend:${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.title=backend
            org.opencontainers.image.version=${{ steps.meta.outputs.full_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            APP_VERSION=${{ steps.meta.outputs.full_tag }}
            COMMIT=${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_SHORT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          # The runtime stage is never taken from the cache: its `apk upgrade` must run on every build, or
          # a cached layer keeps an old package until the base image changes (frontend: pcre2 CVE,
          # 2026-10-07). pull: the newest base image of the pinned tag, for the same reason.
          no-cache-filters: runtime
          pull: true
          platforms: linux/amd64

      - name: Trivy scan linux/amd64 (blocking, before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-scan/backend:${{ github.sha }}-amd64
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      - name: Build image for the scan (linux/arm64, local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: local-scan/backend:${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.title=backend
            org.opencontainers.image.version=${{ steps.meta.outputs.full_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            APP_VERSION=${{ steps.meta.outputs.full_tag }}
            COMMIT=${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_SHORT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          # The runtime stage is never taken from the cache: its `apk upgrade` must run on every build, or
          # a cached layer keeps an old package until the base image changes (frontend: pcre2 CVE,
          # 2026-10-07). pull: the newest base image of the pinned tag, for the same reason.
          no-cache-filters: runtime
          pull: true
          platforms: linux/arm64

      - name: Trivy scan linux/arm64 (blocking, before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-scan/backend:${{ github.sha }}-arm64
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: "1"

      # Publish exactly what Trivy scanned: the two loaded single-platform images are pushed as
      # <tag>-amd64 / <tag>-arm64 and joined into one multi-platform index. No second build, so
      # nothing unscanned can be shipped (a rebuild could pull newer packages on a cache miss).
      # The -amd64/-arm64 tags do not match the Flux image policies (they end in -<timestamp>).
      - name: Push the scanned images as one multi-platform image
        id: build
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          FULL_TAG: ${{ steps.meta.outputs.full_tag }}
          ENV_TAG: ${{ steps.env.outputs.environment }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          SCANNED: local-scan/backend:${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker tag "${SCANNED}-${arch}" "${REPO}:${FULL_TAG}-${arch}"
            docker push "${REPO}:${FULL_TAG}-${arch}"
          done
          docker buildx imagetools create \
            --tag "${REPO}:${ENV_TAG}" \
            --tag "${REPO}:${FULL_TAG}" \
            --tag "${REPO}:${SHORT_SHA}" \
            "${REPO}:${FULL_TAG}-amd64" "${REPO}:${FULL_TAG}-arm64"
          digest="$(docker buildx imagetools inspect "${REPO}:${FULL_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${REPO}:${FULL_TAG}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for exactly the published index. BuildKit's own provenance is not carried
      # when the scanned, loaded images are pushed, so GitHub signs one (Sigstore, GitHub OIDC) and
      # pushes it to the registry next to the image. Verify: gh attestation verify oci://<image> --owner safeops-course
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # One SBOM per published platform, all attested to the index digest - the digest a tag resolves
      # to and admission verifies. syft scans one platform of a multi-platform image (linux/amd64 when
      # none is named), so a single SBOM described amd64 only, while kind on Apple silicon runs arm64.
      # Each SBOM names its platform in the image's package URL (pkg:oci/...?arch=arm64).
      - name: Generate and attach one SBOM attestation per platform
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # syft pinned and checksum-verified (this job holds packages:write and id-token:write).
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C /usr/local/bin syft
          rm "${archive}"
          image="${IMAGE}@${DIGEST}"
          # The platforms the index holds - not attestation manifests (unknown/unknown).
          platforms="$(docker buildx imagetools inspect --raw "${image}" \
            | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          [[ -n "${platforms}" ]] || { echo "::error::no platforms in the index ${image}"; exit 1; }
          for platform in ${platforms}; do  # one per line, no spaces: word splitting is the point
            arch="${platform#*/}"
            syft "${image}" --platform "${platform}" -o "spdx-json=sbom-${arch}.spdx.json"
            cosign attest --yes --predicate "sbom-${arch}.spdx.json" --type spdxjson "${image}"
          done
          echo "${platforms}" > platforms.txt

      # Fail loudly when a published platform has no SBOM that admission can read: the attestations are
      # verified the way the cluster does (this workflow's identity), and each one's architecture is
      # read from the image's package URL.
      - name: Every published platform has an SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          image="${IMAGE}@${DIGEST}"
          attested="$(cosign verify-attestation --type spdxjson "${image}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${IDENTITY}" \
            | jq -r '.payload' | base64 -d \
            | jq -r '.predicate.packages[].externalRefs[]?.referenceLocator | select(startswith("pkg:oci/"))
                | capture("arch=(?<a>[^&]+)").a' | sort -u)"
          expected="$(sed 's|.*/||' platforms.txt | sort -u)"
          echo "published: $(tr '\n' ' ' <<<"${expected}")  attested: $(tr '\n' ' ' <<<"${attested}")"
          if [[ "${attested}" != "${expected}" ]]; then
            echo "::error::SBOM attestations (${attested//$'\n'/ }) do not cover the published platforms (${expected//$'\n'/ })"
            exit 1
          fi

      - name: Output summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.env.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta.outputs.full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Supply Chain:**" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: no fixable CRITICAL/HIGH (scanned before push)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cosign signature (keyless, GitHub OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM attestation (SPDX)" >> $GITHUB_STEP_SUMMARY
          echo "- SLSA build provenance (GitHub attestation)" >> "$GITHUB_STEP_SUMMARY"
          echo "- govulncheck passed" >> $GITHUB_STEP_SUMMARY
