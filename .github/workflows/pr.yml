name: PR checks
run-name: "PR checks ${{ github.head_ref }}"

# Everything a change must pass before it can merge (security review 2026-09-27, plan S4).
# build.yml runs on pushes to main/develop and publishes the image; this workflow only verifies.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.8.0
  GOLANGCI_LINT_VERSION: v2.14.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  test:
    name: test (vet, race, govulncheck)
    runs-on: ubuntu-latest
    # A real Postgres for the migration tests (pkg/migrations): they apply the embedded migrations
    # to fresh databases and skip without TEST_DATABASE_URL - here they always run.
    services:
      postgres:
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  # Expand / contract, checked (Chapter 18): the previous release - the base branch - must keep working
  # on the schema this pull request migrates to. That is what makes rolling back the image safe
  # without rolling back the data. Black-box on purpose: build both binaries and drive them through
  # their HTTP API, in the order a release and its rollback happen:
  #   1. the previous release migrates and writes a user - data that exists before the migration;
  #   2. this pull request migrates and writes a user with everything it stores (a display name);
  #   3. the previous release's migrate (its initContainer in a rollback) accepts that schema, and the
  #      previous app logs in both users: old data survived, new data is readable by old code.
  # Limit: "previous" is the base commit - what develop runs before this merge. Production may be
  # several releases behind; rolling it back further than one release is not checked here.
  previous-release:
    name: previous release on this schema (N-1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      JWT_SECRET: n-minus-1-check-only-0123456789abcdef
    steps:
      - name: Checkout this pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the previous release (the base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}   # the exact base commit, not the moving branch
          path: previous
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build both binaries
        run: |
          go build -o "${RUNNER_TEMP}/new-backend" ./cmd/api
          (cd previous && go build -o "${RUNNER_TEMP}/previous-backend" ./cmd/api)

      - name: Release, then rollback, on one database
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          pid=""
          trap '[[ -n "${pid}" ]] && kill "${pid}" 2>/dev/null || true' EXIT

          # serve <previous|new>: start that release's app and wait until it is ready.
          serve() {
            "${RUNNER_TEMP}/$1-backend" > "${RUNNER_TEMP}/$1.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              curl -sf -o /dev/null http://localhost:8080/readyz && return 0
              sleep 1
            done
            echo "::error::the $1 release did not become ready"; cat "${RUNNER_TEMP}/$1.log"; exit 1
          }
          # stop: stop the running app and wait until it has exited (the port is free again).
          stop() { kill "${pid}"; wait "${pid}" 2>/dev/null || true; pid=""; }
          # call <register|login> <username> <want status> [display name]: one request, checked.
          call() {
            local action=$1 user=$2 want=$3 name=${4:-} body code
            body=$(jq -nc --arg u "${user}" --arg n "${name}" \
              '{username: $u, password: "n-minus-1-password"} + (if $n == "" then {} else {display_name: $n} end)')
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "${body}" "http://localhost:8080/auth/${action}")
            if [[ "${code}" != "${want}" ]]; then
              echo "::error::${action} ${user}: ${code}, want ${want}"; cat "${RUNNER_TEMP}"/*.log; exit 1
            fi
            echo "${action} ${user}: ${code}"
          }

          echo "1. the previous release (${BASE_REF}) migrates and writes"
          "${RUNNER_TEMP}/previous-backend" migrate
          serve previous
          call register written-before 201
          stop

          echo "2. this pull request migrates and writes"
          "${RUNNER_TEMP}/new-backend" migrate
          serve new
          call register written-by-new 201 "Display Name"
          call login written-before 200
          stop

          echo "3. rollback: the previous release's migrate and app on this schema"
          "${RUNNER_TEMP}/previous-backend" migrate
          serve previous
          call login written-before 200
          call login written-by-new 200
          stop
          echo "the previous release (${BASE_REF}) works on this pull request's schema, with data from both"

  lint:
    name: lint (golangci-lint + gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Config: .golangci.yml (standard linters + gosec; every exclusion is commented).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  image:
    name: image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, never push: a broken Dockerfile fails the PR, not the deploy.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          rm "${archive}"

      # Only the commits of this PR, including what a merge commit changes (first-parent diff:
      # e.g. a conflict resolution). --redact keeps any finding's value out of the log.
      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
