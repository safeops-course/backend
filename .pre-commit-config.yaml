# The checks CI runs on every pull request (.github/workflows/pr.yml), on your machine first - so a
# lint or test failure shows up before the push, not minutes later on GitHub.
#   pre-commit (every commit, fast): gofmt, go vet, golangci-lint (incl. gosec), gitleaks on the
#                                    staged changes, no commit to main
#   pre-push   (before a push):      go test -race, govulncheck
# Install once per clone: make install-hooks   (needs pre-commit and Go; the linters run pinned through
# `go run`, so nothing else to install). The versions below must match pr.yml - change them together.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit] # the hooks without stages: run on commit only; go test and govulncheck set pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # = GITLEAKS_VERSION in pr.yml
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (files must be formatted)
        entry: bash -c 'unformatted=$(gofmt -l "$@"); [ -z "$unformatted" ] || { echo "run gofmt -w on:"; echo "$unformatted"; exit 1; }' --
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint (+ gosec, .golangci.yml)
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./... # = GOLANGCI_LINT_VERSION
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test -race
        entry: go test -race -count=1 ./...
        language: system
        types_or: [go, go-mod]
        pass_filenames: false
        stages: [pre-push]

      - id: govulncheck
        name: govulncheck
        entry: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... # = GOVULNCHECK_VERSION
        language: system
        types_or: [go, go-mod]
        pass_filenames: false
        stages: [pre-push]
