# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo-specific rules. Organization defaults (language, tone, workflows, Dockerfile, shell,
# *.example, CLAUDE/AGENT docs, pre-merge checks off, knowledge base scopes) come from
# safeops-course/coderabbit/.coderabbit.yaml through `inheritance: true`.
# CodeRabbit config for safeops-course/backend (Go reference service for the SafeOps course).
# Every tool is enabled by default; only tools that need settings are listed below.
tone_instructions: "KISS: this is a small reference service for a Kubernetes/SRE course. Focus on correctness, security and operability; skip over-engineering and style nitpicks."
reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Default [] reviews only PRs into main; feature work lands in develop first.
    base_branches:
      - develop
  path_instructions:
    - path: "**"
      instructions: |
        Reference Go service for a Kubernetes/SRE course: health probes, chaos endpoints,
        Prometheus + OpenTelemetry, JWT auth with a Postgres or file-backed user store.
        Deployed by Flux from safeops-course/sre to develop, staging and production.
        Be strict on: security, error handling, goroutine/resource leaks, anything that
        breaks probes, metrics or the deploy contract. Chaos and debug endpoints
        (/panic, /delay, /status, /env, /debug/pprof) are intentional - do not ask to remove them.
        No literal secrets, tokens or DSNs with credentials; no non-empty default for JWT_SECRET or POSTGRES_PASSWORD (obvious dummies in *_test.go are fine).
    - path: "**/*.go"
      instructions: |
        - Go toolchain version comes from go.mod (`go` directive); router is go-chi/chi v5.
        - Runtime config is parsed in pkg/config (env vars with CLI-flag overrides). Exceptions
          that exist today: pkg/telemetry reads SERVICE_NAME/SERVICE_VERSION/DEPLOYMENT_ENVIRONMENT/
          UPTRACE_DSN and pkg/logger reads DEPLOYMENT_ENVIRONMENT. New settings belong in pkg/config.
        - CONFIG_PATH is a mounted ConfigMap/Secret directory hot-reloaded by pkg/configwatch.
        - Version metadata is injected via -ldflags into pkg/version - never hardcode it.
        - Prometheus metrics use the server's own registry (prometheus.NewRegistry), never the global default.
        - Middleware order in server.New is deliberate: RequestID, RealIP, Recoverer, CORS, OTel,
          metrics, logging, random chaos behaviour. Flag reordering.
        - JWT_SECRET is required (startup fails without it); never add a default secret.
        - Check: errors handled or explicitly ignored with a reason; context propagated to spans and DB calls;
          goroutines and watchers stop on shutdown.
        - Tests use the standard testing package and net/http/httptest only.
    - path: "pkg/api/docs/**"
      instructions: |
        Generated by swaggo/swag ("DO NOT EDIT"). Do not review the content line by line.
        Only flag hand edits, or handler annotation changes in pkg/server without a regenerated docs update.
    - path: "go.mod"
      instructions: |
        - The `go` directive must EQUAL ARG GO_VERSION in Dockerfile and GO_VERSION in Makefile (not just be <=): CI runs govulncheck with setup-go go-version-file: go.mod, so the scanned standard library is the go.mod version - a newer Dockerfile toolchain would ship a binary that was never scanned.
        - For dependency bumps, point out major-version jumps and known-vulnerable versions;
          CI runs govulncheck on every push to develop and main and fails the build on findings.
    - path: "Dockerfile"
      instructions: |
        - Multi-stage: golang:${GO_VERSION}-alpine build stage, pinned alpine runtime stage.
        - Static binary: CGO_ENABLED=0 with cross-compilation via TARGETOS/TARGETARCH.
        - Runtime must stay non-root: user `app` with uid 10001. The Kubernetes Deployment in
          safeops-course/sre sets runAsUser 10001 and readOnlyRootFilesystem (only /tmp is writable).
        - Version metadata comes from build args APP_VERSION, APP_COMMIT, APP_COMMIT_SHORT, BUILD_DATE via -ldflags.
        - Check: no extra packages in the runtime stage.
    - path: ".github/workflows/**"
      instructions: |
        - build.yml (push to develop/main): govulncheck (blocking), multi-arch build amd64+arm64,
          push to GHCR, cosign keyless signing, SBOM attestation, Trivy image scan (report-only, exit-code 0).
        - promote-production.yml (manual): Trivy gate on CRITICAL (blocking), re-tag the staging image
          as production without rebuilding, GitHub Release, next patch tag.
        - Image tag format is `<env>-v<semver>-<shortsha>-<unix-ts>`; Flux ImagePolicies in
          safeops-course/sre and the promotion regex depend on it - flag any change.
        - Check: least-privilege permissions, no secrets echoed to logs, errors not swallowed.
    - path: "{trivy.yaml,.trivyignore}"
      instructions: |
        Scanner configuration. Every ignored CVE needs a reason and an expiry/revisit note.
        Flag changes that silently lower severity thresholds.
    - path: "Makefile"
      instructions: |
        Local developer targets only (CI does not call make). GO_VERSION and ldflags must stay in sync with the Dockerfile.
  tools:
    golangci-lint:
      enabled: true # no .golangci.yml in the repo -> CodeRabbit uses its profile-based defaults
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - files: "TELEMETRY.md"
        applyTo: "pkg/telemetry/**,pkg/logger/**,cmd/api/**"
  linked_repositories:
    - repository: "safeops-course/sre"
      instructions: "Deploys this image with Flux: flux/apps/backend/** (Deployment env vars, probes /livez /readyz /healthz, securityContext uid 10001 + readOnlyRootFilesystem, ImagePolicy tag regex). Check env var, port, probe and tag changes against it."
    - repository: "safeops-course/frontend"
      instructions: "Vue SPA that calls this API through nginx /api/ (src/services/api.js). Flag route or response-shape changes that break it."
chat:
  auto_reply: false
inheritance: true
